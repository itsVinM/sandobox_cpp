# devops-sandbox test matrix.
#
#   docker compose up --build linux      # functional: real clone/cgroup/seccomp
#   docker compose up --build windows    # cross-compile smoke (mingw-w64)
#   docker compose up --build macos      # cross-compile smoke (osxcross)
#   docker compose up --build            # everything
#
# Linux needs extra privileges (CLONE_NEWPID/CLONE_NEWNET/cgroup writes):
#   privileged: true

services:
  linux:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: devops-sandbox-linux
    privileged: true
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: bash docker/scripts/test_linux.sh

  windows:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: devops-sandbox-linux
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: bash docker/scripts/cross_smoke_win.sh

  # macOS cross-compile via Zig's bundled macOS SDK (no Apple hardware needed).
  macos:
    image: devops-sandbox-linux
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: bash docker/scripts/cross_smoke_mac.sh